
name: Build and Draft Release - Corel Page Copier

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  # PR juga diverifikasi (static checks + regression tests + build x64) supaya
  # perubahan tidak masuk main tanpa bukti build Windows.
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Static checks (undo grouping, watermark exclusion, unit normalization)
        shell: pwsh
        run: |
          python tools/static-checks.py
          if ($LASTEXITCODE -ne 0) {
            throw "Static checks failed."
          }

      - name: Regression tests (tanpa CorelDRAW)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet run --project tests/CorelPageCopier.RegressionTests --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "Regression tests failed with exit code $LASTEXITCODE"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build .NET Framework 4.8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "CorelPageCopier/CorelPageCopier.vbproj"

          if (!(Test-Path $project)) {
            throw "Project file not found: $project"
          }

          msbuild $project /m /t:Rebuild /p:Configuration=Release /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Prepare release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = "CorelPageCopier/bin/x64/Release/CorelPageCopier.exe"

          if (!(Test-Path $exe)) {
            $exe = "CorelPageCopier/bin/Release/CorelPageCopier.exe"
          }

          if (!(Test-Path $exe)) {
            throw "EXE not found. Check the MSBuild output path."
          }

          New-Item -ItemType Directory -Force -Path release-package | Out-Null

          Copy-Item $exe "release-package/CorelPageCopier.exe"
          Copy-Item "CorelPageCopier/README_ID.md" "release-package/README_ID.md"

          if (Test-Path "CorelPageCopier/ToolbarLauncher.bas") {
            Copy-Item "CorelPageCopier/ToolbarLauncher.bas" "release-package/ToolbarLauncher.bas"
          }

          Compress-Archive `
            -Path "release-package/*" `
            -DestinationPath "CorelPageCopier-Windows-x64.zip" `
            -Force

          Write-Host "Release package prepared successfully."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CorelPageCopier-Windows-x64
          path: |
            release-package/CorelPageCopier.exe
            CorelPageCopier-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            CorelPageCopier-Windows-x64.zip
            release-package/CorelPageCopier.exe
