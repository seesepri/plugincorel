name: Build and Release Corel Page Copier

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build .NET Framework 4.8 x64
        shell: pwsh
        run: |
          $project = "CorelPageCopier_MODERN/CorelPageCopier.vbproj"
          if (!(Test-Path $project)) { throw "Project file not found: $project" }
          msbuild $project /m /t:Build /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Prepare release package
        shell: pwsh
        run: |
          $exe = "CorelPageCopier_MODERN/bin/x64/Release/CorelPageCopier.exe"
          if (!(Test-Path $exe)) {
            $exe = "CorelPageCopier_MODERN/bin/Release/CorelPageCopier.exe"
          }
          if (!(Test-Path $exe)) { throw "Built executable was not found. Check project output path." }
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item $exe release-package/
          Copy-Item "CorelPageCopier_MODERN/README_ID.md" release-package/README_ID.md
          if (Test-Path "CorelPageCopier_MODERN/ToolbarLauncher.bas") {
            Copy-Item "CorelPageCopier_MODERN/ToolbarLauncher.bas" release-package/ToolbarLauncher.bas
          }
          Compress-Archive -Path "release-package/*" -DestinationPath "CorelPageCopier-Windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorelPageCopier-Windows-x64
          path: CorelPageCopier-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: CorelPageCopier-Windows-x64.zip
